name: kgps_locator
description: Aplicativo Flutter de geolocalizacao e bussola baseado no roteiro Flutter Geolocator.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  flutter_device_compass: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
